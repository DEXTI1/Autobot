<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1040" height="660" fill="#0e1117"/>
  <text x="520" y="34" fill="#e6edf3" font-size="22" font-weight="700" text-anchor="middle">Rejection-Block Retracement — how the trade works</text>
  <text x="520" y="56" fill="#9aa4b2" font-size="13" text-anchor="middle">Mark the 1H rejection block, wait for a 5m retrace into it, enter, stop just below the block, target the opposite block</text>

  <!-- plot frame -->
  <rect x="70" y="80" width="700" height="500" fill="#11161f" stroke="#2a3340" stroke-width="1"/>

  <!-- ===== BEARISH RB zone (resistance / target) ===== -->
  <rect x="70" y="110" width="700" height="40" fill="#ef5350" opacity="0.16"/>
  <line x1="70" y1="150" x2="770" y2="150" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="78" y="104" fill="#ff8a8a" font-size="13" font-weight="700">1H BEARISH rejection block  (swing high + long upper wick)  =  TARGET zone</text>
  <text x="556" y="166" fill="#ff8a8a" font-size="12" font-weight="700">🎯 TAKE-PROFIT = opposite block proximal</text>

  <!-- ===== BULLISH RB zone (support / entry) ===== -->
  <rect x="70" y="380" width="700" height="50" fill="#26a69a" opacity="0.18"/>
  <line x1="70" y1="380" x2="770" y2="380" stroke="#2ee6c5" stroke-width="2"/>
  <line x1="70" y1="430" x2="770" y2="430" stroke="#1b8a7a" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="300" y="375" fill="#2ee6c5" font-size="12" font-weight="700">proximal edge  →  ENTRY (buy here)</text>
  <text x="78" y="446" fill="#7fd8c8" font-size="11">block low = distal edge</text>
  <text x="78" y="466" fill="#9aa4b2" font-size="12" font-weight="700">1H BULLISH rejection block (swing low + long lower wick) = SUPPORT</text>

  <!-- ===== STOP LOSS ===== -->
  <line x1="70" y1="452" x2="770" y2="452" stroke="#ff5252" stroke-width="2" stroke-dasharray="9 4"/>
  <text x="556" y="448" fill="#ff5252" font-size="12" font-weight="700">🛑 STOP-LOSS (just below the block)</text>

  <!-- ===== CANDLES ===== wick = line, body = rect ===== -->
  <!-- 1: bullish RB candle (long lower wick, swing low) -->
  <line x1="120" y1="350" x2="120" y2="430" stroke="#26a69a" stroke-width="2"/>
  <rect x="112" y="360" width="16" height="28" fill="#26a69a"/>
  <!-- 2 up -->
  <line x1="160" y1="325" x2="160" y2="365" stroke="#26a69a" stroke-width="2"/>
  <rect x="152" y="330" width="16" height="30" fill="#26a69a"/>
  <!-- 3 up -->
  <line x1="200" y1="300" x2="200" y2="338" stroke="#26a69a" stroke-width="2"/>
  <rect x="192" y="305" width="16" height="28" fill="#26a69a"/>
  <!-- 4 retrace down -->
  <line x1="240" y1="300" x2="240" y2="338" stroke="#ef5350" stroke-width="2"/>
  <rect x="232" y="305" width="16" height="28" fill="#ef5350"/>
  <!-- 5 retrace down -->
  <line x1="280" y1="325" x2="280" y2="372" stroke="#ef5350" stroke-width="2"/>
  <rect x="272" y="330" width="16" height="32" fill="#ef5350"/>
  <!-- 6 ENTRY candle: touches proximal 380 -->
  <line x1="320" y1="355" x2="320" y2="392" stroke="#ef5350" stroke-width="2"/>
  <rect x="312" y="360" width="16" height="22" fill="#ef5350"/>
  <!-- 7 up off block -->
  <line x1="360" y1="345" x2="360" y2="388" stroke="#26a69a" stroke-width="2"/>
  <rect x="352" y="350" width="16" height="32" fill="#26a69a"/>
  <!-- 8 up -->
  <line x1="400" y1="295" x2="400" y2="355" stroke="#26a69a" stroke-width="2"/>
  <rect x="392" y="300" width="16" height="50" fill="#26a69a"/>
  <!-- 9 up -->
  <line x1="440" y1="245" x2="440" y2="305" stroke="#26a69a" stroke-width="2"/>
  <rect x="432" y="250" width="16" height="50" fill="#26a69a"/>
  <!-- 10 up -->
  <line x1="480" y1="190" x2="480" y2="255" stroke="#26a69a" stroke-width="2"/>
  <rect x="472" y="195" width="16" height="55" fill="#26a69a"/>
  <!-- 11 up: reaches target 150 -->
  <line x1="520" y1="148" x2="520" y2="200" stroke="#26a69a" stroke-width="2"/>
  <rect x="512" y="152" width="16" height="43" fill="#26a69a"/>
  <!-- 12 bearish RB at top (long upper wick, swing high) -->
  <line x1="560" y1="110" x2="560" y2="185" stroke="#ef5350" stroke-width="2"/>
  <rect x="552" y="152" width="16" height="28" fill="#ef5350"/>

  <!-- ENTRY arrow + marker -->
  <circle cx="320" cy="380" r="6" fill="#ffd166" stroke="#11161f" stroke-width="1.5"/>
  <path d="M320,470 L320,392" stroke="#ffd166" stroke-width="2" marker-end="url(#arr)"/>
  <text x="246" y="488" fill="#ffd166" font-size="12" font-weight="700">ENTRY: 5m retrace touches block</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ffd166"/>
    </marker>
  </defs>

  <!-- ===== RR bracket on the right ===== -->
  <!-- reward (380 -> 150) -->
  <line x1="800" y1="150" x2="800" y2="380" stroke="#2ee6c5" stroke-width="2"/>
  <line x1="794" y1="150" x2="806" y2="150" stroke="#2ee6c5" stroke-width="2"/>
  <line x1="794" y1="380" x2="806" y2="380" stroke="#2ee6c5" stroke-width="2"/>
  <text x="812" y="270" fill="#2ee6c5" font-size="13" font-weight="700">REWARD</text>
  <!-- risk (380 -> 452) -->
  <line x1="800" y1="380" x2="800" y2="452" stroke="#ff5252" stroke-width="2"/>
  <line x1="794" y1="452" x2="806" y2="452" stroke="#ff5252" stroke-width="2"/>
  <text x="812" y="420" fill="#ff5252" font-size="13" font-weight="700">RISK</text>
  <text x="800" y="500" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle">RR ≈ 3 : 1</text>
  <text x="800" y="520" fill="#9aa4b2" font-size="11" text-anchor="middle">small risk, big reward</text>

  <!-- ===== step labels along bottom ===== -->
  <text x="120" y="600" fill="#9aa4b2" font-size="11" text-anchor="middle">1. block forms</text>
  <text x="220" y="600" fill="#9aa4b2" font-size="11" text-anchor="middle">2. price leaves</text>
  <text x="320" y="618" fill="#9aa4b2" font-size="11" text-anchor="middle">3. retrace + ENTRY</text>
  <text x="520" y="600" fill="#9aa4b2" font-size="11" text-anchor="middle">4. runs to target</text>

  <!-- legend -->
  <rect x="70" y="628" width="14" height="14" fill="#26a69a" opacity="0.6"/>
  <text x="90" y="640" fill="#9aa4b2" font-size="12">Bullish RB (support / entry)</text>
  <rect x="300" y="628" width="14" height="14" fill="#ef5350" opacity="0.6"/>
  <text x="320" y="640" fill="#9aa4b2" font-size="12">Bearish RB (resistance / target)</text>
  <text x="560" y="640" fill="#9aa4b2" font-size="12">Dashed red = stop-loss · Dashed pink = target</text>
</svg>
